name: Build GDExtension
on:
  workflow_call:
  push:
  pull_request:
  merge_group:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            { platform: linux, arch: x86_64, os: ubuntu-22.04 },
            # 32-bit Linux disabled: Godot 4.x deprecated x86_32, and libfluidsynth-dev:i386 unavailable
            # { platform: linux, arch: x86_32, os: ubuntu-22.04 },
            { platform: linux, arch: arm64, os: ubuntu-22.04-arm },
            { platform: linux, arch: arm32, os: ubuntu-22.04-arm },
          ]
        target-type: [template_debug, template_release, editor]
        # Single precision only - godot-cpp extension_api.json is single-precision
        # See: https://github.com/godotengine/godot-cpp/issues/1729
        float-precision: [single]

    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # === LINUX: Use apt ===
      - name: Linux - Install fluidsynth
        if: ${{ matrix.target.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libfluidsynth-dev pkg-config

      - name: Linux - Install multilib support
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_32' }}
        run: |
          sudo apt-get install -y gcc-multilib g++-multilib

      # === WINDOWS/MACOS: Use vcpkg ===
      - name: Export GitHub Actions cache variables
        if: ${{ matrix.target.platform == 'windows' || matrix.target.platform == 'macos' }}
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Windows/macOS - Setup vcpkg
        if: ${{ matrix.target.platform == 'windows' || matrix.target.platform == 'macos' }}
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "66c0373dc7fca549e5803087b9487edfe3aca0a1"

      - name: Windows - Install fluidsynth (x86_64)
        if: ${{ matrix.target.platform == 'windows' && matrix.target.arch == 'x86_64' }}
        run: |
          vcpkg install fluidsynth:x64-windows-static

      - name: Windows - Install fluidsynth (x86_32)
        if: ${{ matrix.target.platform == 'windows' && matrix.target.arch == 'x86_32' }}
        run: |
          vcpkg install fluidsynth:x86-windows-static

      - name: macOS - Install fluidsynth
        if: ${{ matrix.target.platform == 'macos' }}
        run: |
          vcpkg install fluidsynth:arm64-osx fluidsynth:x64-osx

      # === BUILD ===
      - name: Setup godot-cpp (Linux/macOS)
        if: ${{ matrix.target.platform != 'windows' }}
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}

      # Windows: Use MSVC instead of MinGW to avoid Chocolatey dependency issues
      - name: Setup Python (Windows)
        if: ${{ matrix.target.platform == 'windows' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup scons (Windows)
        if: ${{ matrix.target.platform == 'windows' }}
        run: |
          python -m pip install scons
        shell: pwsh

      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      - name: Build GDExtension (Linux)
        if: ${{ matrix.target.platform == 'linux' }}
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }} api_version=4.7

      - name: Build GDExtension (Windows)
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }} use_mingw=no api_version=4.7

      - name: Build GDExtension (macOS)
        if: ${{ matrix.target.platform == 'macos' }}
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }} api_version=4.7

      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdmidiplayer-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.float-precision }}-${{ matrix.target-type }}
          path: |
            ${{ github.workspace }}/bin/**



  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: gdmidiplayer
          pattern: gdmidiplayer-*
          delete-merged: true
  test:
    permissions:
      checks: write
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    needs: merge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fluidsynth (runtime dep of built extension)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfluidsynth-dev fluid-soundfont-gm abcmidi

      - name: Download built extension
        uses: actions/download-artifact@v4
        with:
          name: gdmidiplayer
          path: bin/

      - name: Place extension libraries where res:// expects them
        run: mkdir -p project/bin && cp -r bin/linux project/bin/

      - name: make assets
        run: make assets

      - name: Run GdUnit4 tests
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: 4.7
          project_dir: project/
          paths: |
            res://test/unit
            res://test/integration
          timeout: 10
