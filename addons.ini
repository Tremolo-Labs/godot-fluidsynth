# Third-party addon manifest fetched by 'scons addons' ('make addons' wrapper).
# Addons install into the Godot project so that res:// paths resolve; the
# project/addons/ directory is gitignored except our own addons/midi.
# To upgrade an addon: edit 'version', then rerun 'make addons'.
#
# Keys per section:
#   version        release tag to fetch
#   url            archive URL; {version} placeholders are expanded
#   archive-subdir path inside the archive (relative to its root component)
#                  whose contents become 'destination'
#   destination    install directory inside this repository

[gdUnit4]
version = v6.2.1
url = https://github.com/godot-gdunit-labs/gdUnit4/archive/refs/tags/{version}.tar.gz
archive-subdir = addons/gdUnit4
destination = project/addons/gdUnit4
[godot-midi-player]
version = 252157b64e9a94686b363b3cce53f195cb828aa2
url = https://bitbucket.org/arlez80/godot-midi-player-g4/get/{version}.zip
archive-subdir = addons/midi
# Upstream installs as 'addons/midi', colliding with our own tracked importer
# plugin; install under the repository name instead (its preloads are relative,
# so the folder rename is safe).
destination = project/addons/godot-midi-player
